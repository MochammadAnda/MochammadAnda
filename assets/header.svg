<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-label="Mochammad Anda Fadholli - Web Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F2027"/>
      <stop offset="50%" stop-color="#203A43"/>
      <stop offset="100%" stop-color="#2C5364"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#7B61FF"/>
    </linearGradient>
    <style>
      .name { font: 700 44px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .role { font: 500 22px 'Segoe UI', Arial, sans-serif; fill: #00D4FF; }
      .sub  { font: 400 15px 'Segoe UI', Arial, sans-serif; fill: #b8c7d1; }
      .glow { animation: pulse 4s ease-in-out infinite; transform-origin: center; }
      @keyframes pulse { 0%,100% { opacity: .25; } 50% { opacity: .6; } }
      .fade { animation: fade 1.2s ease-out both; }
      @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    </style>
  </defs>
  <rect width="1000" height="220" rx="16" fill="url(#bg)"/>
  <circle class="glow" cx="880" cy="40" r="90" fill="#00D4FF" opacity=".25"/>
  <circle class="glow" cx="120" cy="200" r="70" fill="#7B61FF" opacity=".25"/>
  <text class="name fade" x="500" y="95" text-anchor="middle">Mochammad Anda Fadholli</text>
  <text class="role fade" x="500" y="135" text-anchor="middle" style="animation-delay:.3s">Web Developer · Full-Stack &amp; REST API</text>
  <text class="sub fade" x="500" y="170" text-anchor="middle" style="animation-delay:.6s">Politeknik Negeri Semarang · Cum Laude · Semarang, Jawa Tengah</text>
  <rect x="430" y="188" width="140" height="4" rx="2" fill="url(#accent)"/>
</svg>
